name: MyFirstWorkflow
#to get triggered on push in this repo
on: 
  push:  
jobs:
  job1:
    name: Job1
    runs-on: ubuntu-latest
    steps:
      -  name: step1
         run: |
              pwd
              ls -ltr
              hostname
              
      - name: Checkout
        uses: actions/checkout@v7
      - name: Step3
        run: | 
             echo 'pwd' >> myartifact.txt
             mkdir artifacts
             echo 'ls -ltr' >> artifacts/list.txt
             echo 'hostname' >> artifacts/hostname.txt
      - name: Upload single file
        uses: actions/upload-artifact@v7
        with:
          name: single-file
          path: .myartifact/.txt
      - name: Upload directory
        uses: actions/upload-artifact@v7
        with:
          name: directory_artifacts
          path: artifacts/
      - name: Upload from multiple paths
        uses: actions/upload-artifact@v7
        with:
          name: multiple_paths_with
          path: ./myartifact.txt
                artifacts/
      - name: Upload from multiple paths
        uses: actions/upload-artifact@v7
        with:
          name: multiple_paths_with_exclusions
          path: ./myartifact.txt
                artifacts/
                !**/hostname.txt
       
            
      
