name: MyFirstWorkflow
#to get triggered on push in this repo
on: push
jobs:
  job1:
    name: Job1
    runs-on: ubuntu-latest
    steps:
      -  name: Running single command on Job1
         run: echo "Hi this is my first github workflow"
      -  name: Checking OS release for Github Hosted Runner
         run: cat /etc/os-release
  job2:
    name: Job2
    runs-on: ubuntu-latest
    steps:
      - name: check hostname on the runner
        run: hostname
      - name: Running multiple commands
        run: |
            echo "Hi from Anjali"
            echo "Current time is 'date'"
            sleep 20
   
  job3:
    name : Job3
    runs-on: windows-latest
    needs: job1
    steps:
      - name: Job with single dependency
        run: sleep 10
      - name: checking runner Info
        shell: pwsh
        run: get-computerinfo

  job4:
    name: Job4
    runs-on: ubuntu-latest
    needs: [job1,job2,job3]
    steps:
       - name: Job with multiple dependencies
         run: sleep 5
       
            
      
