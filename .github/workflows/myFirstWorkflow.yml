name: MyFirstWorkflow
#to get triggered on push in this repo
on: 
  push:  
   branches:
      - main
  pull_request:
    branches:
      - main
env:
  APP_USER : ayn
  APP_PORT : 80
  ENV_TYPE : dev
jobs:
  job1:
    name: Job1
    runs-on: ubuntu-latest
    steps:
      -  name: step1
         run: |
              pwd
              ls -ltr
              hostname
              
      - name: Checkout
        uses: actions/checkout@v7
      - name: Step3
        run: | 
             echo 'pwd' >> myartifact.txt
             mkdir artifacts
             echo 'ls -ltr' >> artifacts/list.txt
             echo 'hostname' >> artifacts/hostname.txt
      - name: Upload single file
        uses: actions/upload-artifact@v7
        with:
          name: single_file
          path: ./myartifact.txt
      - name: Upload directory
        uses: actions/upload-artifact@v7
        with:
          name: directory_artifacts
          path: artifacts/
      - name: Upload from multiple paths
        uses: actions/upload-artifact@v7
        with:
          name: multiple_paths_with
          path: |
               ./myartifact.txt
               artifacts/
      - name: Upload from multiple paths
        uses: actions/upload-artifact@v7
        with:
          name: multiple_paths_with_exclusions
          path: |
                ./myartifact.txt
                artifacts/
                !**/hostname.txt
  job2:
    name: Job2
    needs: job1
    runs-on: ubuntu-latest
    steps:
      -  name: check files in current directory
         run: |
              pwd
              ls -ltr     
      -  name: download single file
         uses: actions/download-artifact@v8
         with:
            name: single_file
      -  name: check files in current directory after download
         run: |
              pwd
              ls -ltr    
      - name : accessing Environment variables
        run : |
            echo "[INFO] Running deployment for $ENV_TYPE with user $APP_USER"
            echo "[INFO] Once deployed application is available on port $APP_PORT
      
