name: MyFirstWorkflow
#to get triggered on push in this repo
on: push
jobs:
  job1:
    name: Job1
    runs-on: ubuntu-latest
    steps:
      -  name: Running single command on Job1
         run: echo "Hi this is my first github workflow"
      -  name: Checking OS release for Github Hosted Runner
         run: cat /etc/os-release
  job2:
    name: Job2
    runs-on: ubuntu-latest
    steps:
      - name: check hostname on the runner
        run: hostname
      - name: Running multiple commands
        run: |
            echo "Hi from Anjali"
            echo "Current time is 'date'"
            sleep 20
            
      
